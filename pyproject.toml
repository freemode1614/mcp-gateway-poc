[project]
name = "mcp-gateway"
version = "0.1.0"
description = "Local MCP Gateway that aggregates multiple MCP backend servers behind a single HTTP/SSE endpoint"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "mcp>=1.2.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.9.0",
    "structlog>=24.4.0",
    "watchfiles>=0.24.0",
    "anyio>=4.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.12.0",
    "ty",
]

[project.scripts]
mcp-gateway = "mcp_gateway.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--strict-markers", "--tb=short"]
markers = [
    "integration: marks tests that exercise multiple components",
    "e2e: marks tests that spawn real subprocesses",
]

[tool.coverage.run]
source = ["src/mcp_gateway"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.coverage.paths]
source = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ty.src]
include = ["src"]

[tool.ty.environment]
python-version = "3.13"
